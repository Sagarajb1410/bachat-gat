<style>
  :root {
    --bg:#07090d; --bg2:#0d1118; --card:#121822; --card2:#18202c; --line:rgba(255,255,255,.07);
    --ink:#eef2f6; --muted:#8b97a8; --gold:#f3c969; --gold2:#d99a2b; --mint:#3ee6a8; --mint-d:#14b37d;
    --em:#3ee6a8; --em-l:rgba(62,230,168,.12); --gold-l:rgba(243,201,105,.12);
    --red:#ff6b6b; --red-l:rgba(255,107,107,.12); --wa:#25d366;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body { font-family:'Outfit', 'Mukta', 'Noto Sans Devanagari', system-ui, sans-serif; color:var(--ink); font-size:16px; line-height:1.35;
         background:radial-gradient(900px 500px at 100% -10%, rgba(243,201,105,.10), transparent 60%),
                    radial-gradient(700px 500px at -20% 30%, rgba(62,230,168,.08), transparent 60%), var(--bg);
         background-attachment:fixed; min-height:100vh; }
  .hidden { display:none !important; }

  /* App bar */
  .appbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px; padding:12px 16px; background:rgba(7,9,13,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .logo { width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg,#ffe29a,var(--gold) 40%,var(--gold2)); display:grid; place-items:center; font-weight:800; color:#1a1204; font-size:20px; flex:none; box-shadow:0 4px 14px rgba(243,201,105,.3); }
  .appbar .ttl { flex:1; min-width:0; }
  .appbar .ttl b { display:block; font-size:15px; font-weight:700; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .appbar .ttl span { font-size:12px; color:var(--gold); }
  .pill { background:var(--card2); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:7px 10px; font:inherit; font-size:13px; }
  .pill option { color:#000; background:#fff; }
  .iconbtn { background:var(--card2); border:1px solid var(--line); color:var(--ink); width:36px; height:36px; border-radius:50%; display:grid; place-items:center; }
  .iconbtn svg { width:18px; height:18px; }

  main { max-width:560px; margin:0 auto; padding:16px 16px 110px; }

  /* Bottom navigation (floating glass bar) */
  .nav { position:fixed; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:10; max-width:536px; margin:0 auto;
         background:rgba(18,24,34,.86); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line);
         border-radius:22px; display:flex; justify-content:space-around; padding:7px 4px; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .nav button { flex:1; background:none; border:0; color:var(--muted); font:inherit; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:3px 2px; min-width:0; }
  .nav button svg { width:22px; height:22px; }
  .nav button span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .nav button.on { color:var(--gold); font-weight:600; }
  .nav .ic { padding:4px 14px; border-radius:999px; display:grid; place-items:center; transition:background .2s; }
  .nav button.on .ic { background:var(--gold-l); }

  /* Cards */
  .card { background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:22px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card h2 { font-size:15px; margin:0 0 12px; font-weight:600; display:flex; align-items:center; gap:8px; color:var(--ink); letter-spacing:.2px; }
  .label { color:var(--muted); font-size:13px; }
  .neg { color:var(--red) !important; }
  .pos { color:var(--mint) !important; }
  .num { font-variant-numeric:tabular-nums; }

  /* Gold bank card hero */
  .hero { position:relative; overflow:hidden; color:#1a1204; border-radius:24px; padding:20px 20px 18px; margin-bottom:14px; isolation:isolate;
          background:linear-gradient(125deg,#fff0bf 0%, #f3c969 28%, #d99a2b 62%, #9a6416 100%);
          box-shadow:0 18px 40px rgba(217,154,43,.28), inset 0 1px 0 rgba(255,255,255,.6); }
  .hero::before { content:''; position:absolute; inset:0; z-index:-1; background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.0) 0 14px, rgba(255,255,255,.07) 14px 15px),
      radial-gradient(300px 160px at 85% -10%, rgba(255,255,255,.55), transparent 70%); }
  .hero::after { content:''; position:absolute; width:260px; height:260px; right:-110px; bottom:-150px; border-radius:50%; border:28px solid rgba(255,255,255,.12); z-index:-1; }
  .hero.dark { color:var(--ink); background:linear-gradient(135deg,#1d2633 0%, #111821 60%, #0b1017 100%); box-shadow:var(--shadow); border:1px solid var(--line); }
  .hero.dark::before { background:radial-gradient(320px 180px at 90% -20%, rgba(62,230,168,.20), transparent 70%), radial-gradient(260px 160px at -10% 120%, rgba(243,201,105,.14), transparent 70%); }
  .hero.dark::after { border-color:rgba(255,255,255,.04); }
  .hero .top { display:flex; align-items:center; justify-content:space-between; }
  .chip { width:42px; height:32px; border-radius:7px; background:linear-gradient(135deg,#fdf1c6,#caa04a 55%,#f6dc8e); box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); position:relative; }
  .chip::before, .chip::after { content:''; position:absolute; left:6px; right:6px; height:1px; background:rgba(0,0,0,.25); }
  .chip::before { top:11px; } .chip::after { bottom:11px; }
  .brand { font-weight:800; letter-spacing:.02em; font-size:12px; opacity:.75; text-transform:uppercase; }
  .hero .hi { font-size:14px; opacity:.85; }
  .hero .cap { font-size:12px; opacity:.75; margin-top:16px; letter-spacing:.02em; font-weight:600; }
  .hero .amt { font-size:42px; font-weight:800; letter-spacing:-1px; line-height:1.05; margin:4px 0 14px; font-variant-numeric:tabular-nums; }
  .hero .cardno { font-family:'Outfit',monospace; letter-spacing:3px; font-size:15px; opacity:.8; margin-bottom:12px; }
  .hero .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; position:relative; z-index:1; }
  .hero .mini { background:rgba(255,255,255,.28); border:1px solid rgba(255,255,255,.35); border-radius:14px; padding:9px 12px; }
  .hero.dark .mini { background:rgba(255,255,255,.05); border-color:var(--line); }
  .hero .mini span { font-size:12px; opacity:.8; display:block; }
  .hero .mini b { font-size:18px; font-variant-numeric:tabular-nums; }
  .hero .holder { display:flex; justify-content:space-between; align-items:flex-end; font-size:12px; opacity:.85; margin-top:14px; }
  .hero .holder b { display:block; font-size:15px; letter-spacing:.06em; text-transform:uppercase; }

  .badge { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge.gold { background:var(--gold-l); color:var(--gold); border:1px solid rgba(243,201,105,.25); }
  .hero .badge.gold { background:rgba(26,18,4,.85); color:var(--gold); border:0; }
  .badge.green { background:var(--em-l); color:var(--mint); }
  .badge.red { background:var(--red-l); color:var(--red); }
  .badge.grey { background:rgba(255,255,255,.06); color:var(--muted); }

  .loancard { display:flex; gap:14px; align-items:center; }
  .loancard .ico { width:48px; height:48px; border-radius:15px; display:grid; place-items:center; flex:none; }
  .loancard .ico svg { width:24px; height:24px; }
  .loancard .big2 { font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }

  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat { background:rgba(255,255,255,.035); border:1px solid var(--line); border-radius:16px; padding:12px; }
  .stat span { font-size:12px; color:var(--muted); display:block; }
  .stat b { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }

  /* Charts */
  .chart { width:100%; height:auto; display:block; }
  .donutwrap { display:flex; gap:16px; align-items:center; }
  .donutwrap svg { width:132px; height:132px; flex:none; }
  .legend { list-style:none; margin:0; padding:0; flex:1; min-width:0; font-size:13.5px; }
  .legend li { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .legend i { width:10px; height:10px; border-radius:3px; flex:none; }
  .legend span { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
  .legend b { font-variant-numeric:tabular-nums; }
  .ringwrap { display:flex; gap:16px; align-items:center; margin-top:14px; }
  .ringwrap svg { width:96px; height:96px; flex:none; }

  /* Lists */
  .list { list-style:none; margin:0; padding:0; }
  .li { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .li:last-child { border-bottom:0; }
  .li.me { background:var(--gold-l); margin:0 -18px; padding:12px 18px; }
  .av { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; font-weight:700; font-size:15px; color:#fff; flex:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .li .mid { flex:1; min-width:0; }
  .li .mid b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li .mid small { color:var(--muted); font-size:13px; }
  .li .end { text-align:right; flex:none; }
  .li .end b { display:block; font-weight:700; font-variant-numeric:tabular-nums; }
  .mbadge { width:46px; height:46px; border-radius:15px; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--gold); display:grid; place-items:center; text-align:center; font-weight:700; font-size:12px; line-height:1.05; flex:none; }
  .mbadge small { display:block; font-weight:500; font-size:10.5px; color:var(--muted); }
  .totalrow { display:flex; justify-content:space-between; padding:14px 0 2px; border-top:1px solid rgba(243,201,105,.35); margin-top:4px; font-weight:700; }

  .progress { height:10px; background:rgba(255,255,255,.06); border-radius:999px; overflow:hidden; margin:8px 0 4px; }
  .progress i { display:block; height:100%; background:linear-gradient(90deg,var(--mint-d),var(--mint)); border-radius:999px; transition:width .6s ease; }

  /* Forms */
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; font-weight:500; }
  input, select.f { width:100%; font:inherit; font-size:18px; padding:13px 14px; border:1px solid rgba(255,255,255,.1); border-radius:14px; background:rgba(255,255,255,.04); color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s; color-scheme:dark; }
  input::placeholder { color:#4f5a69; }
  input:focus, select.f:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(243,201,105,.18); }
  select.f option { background:#121822; }
  .btn { width:100%; display:block; background:linear-gradient(135deg,#ffe29a,var(--gold) 45%,var(--gold2)); color:#1a1204; border:0; border-radius:16px; font:inherit; font-size:17px; font-weight:700; padding:15px; margin-top:18px; box-shadow:0 10px 24px rgba(217,154,43,.3); letter-spacing:.2px; }
  .btn:active { transform:translateY(1px); }
  .btn.ghost { background:rgba(255,255,255,.04); color:var(--gold); border:1px solid rgba(243,201,105,.4); box-shadow:none; font-size:15px; padding:12px; margin-top:0; }
  .btn.gold { background:linear-gradient(135deg,var(--mint),var(--mint-d)); color:#04150e; box-shadow:0 10px 24px rgba(62,230,168,.22); }
  button:disabled { opacity:.6; }
  .err { color:var(--red); margin-top:10px; min-height:1.2em; font-size:14.5px; }
  .ok { color:var(--mint); margin-top:10px; font-weight:600; }
  .wa { display:inline-flex; align-items:center; gap:6px; background:var(--wa); color:#04150e; text-decoration:none; font-weight:700; padding:9px 14px; border-radius:999px; font-size:14px; box-shadow:0 6px 16px rgba(37,211,102,.25); }
  .wa svg { width:17px; height:17px; }
  .wa.sent { background:var(--em-l); color:var(--mint); box-shadow:none; }

  /* Login */
  .login-hero { padding:34px 8px 26px; text-align:center; }
  .login-hero .logo { width:76px; height:76px; border-radius:24px; font-size:38px; margin:0 auto 16px; box-shadow:0 16px 40px rgba(243,201,105,.35); }
  .login-hero h1 { margin:0; font-size:25px; font-weight:800; letter-spacing:.2px; }
  .login-hero p { margin:6px 0 0; color:var(--gold); }
  #lpin { letter-spacing:.6em; font-size:26px; text-align:center; }
  .secure { display:flex; gap:6px; align-items:center; justify-content:center; color:var(--muted); font-size:12.5px; margin-top:16px; }
  .secure svg { width:14px; height:14px; color:var(--mint); }

  /* Treasurer entry */
  .mrow { background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:18px; padding:13px 14px; margin-bottom:10px; border-left:3px solid transparent; }
  .mrow.saved { border-left-color:var(--mint); }
  .mrow .head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .mrow .head .av { width:34px; height:34px; font-size:13px; border-radius:11px; }
  .mrow .head b { flex:1; }
  .mrow .hint { font-size:13px; color:var(--gold); background:var(--gold-l); border-radius:10px; padding:6px 10px; margin-bottom:8px; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
  .fields label { margin:4px 0 3px; font-size:12px; }
  .fields input { font-size:16px; padding:10px; border-radius:12px; }
  .sticky { position:sticky; bottom:92px; z-index:5; }
  .loading { display:grid; place-items:center; padding:70px 0; }
  .spin { width:34px; height:34px; border-radius:50%; border:3px solid rgba(243,201,105,.15); border-top-color:var(--gold); animation:sp 0.8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .fade { animation:fd .35s ease both; }
  .fade:nth-child(2) { animation-delay:.05s; } .fade:nth-child(3) { animation-delay:.1s; } .fade:nth-child(4) { animation-delay:.15s; }
  @keyframes fd { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin:18px 0; }
  @media (prefers-reduced-motion: reduce) { .fade, .spin, .progress i { animation:none; transition:none; } }
</style>
</head>

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  function done(r) {
    if (r && r.error === 'session') { logout(true); }
    return r || { ok:false, error:'network' };
  }
  if (ON_GOOGLE) {
    return new Promise(function (resolve) {
      google.script.run
        .withSuccessHandler(function (r) { resolve(done(r)); })
        .withFailureHandler(function () { resolve({ ok:false, error:'network' }); })[fn].apply(null, args);
    });
  }
  // Plain-text POST keeps this a "simple" request, so the browser allows Google's answer.
  return fetch(APP_URL, { method:'POST', body: JSON.stringify({ fn: fn, args: args }), redirect:'follow' })
    .then(function (res) { return res.json(); })
    .then(done)
    .catch(function () { return { ok:false, error:'network' }; });
}

/* Count the big number up from 0 so the balance feels alive. */
function countUp(el, to) {
  if (!el) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = rs(to); return; }
  var t0 = null, dur = 700;
  function step(ts) {
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = rs(to * e);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- Small SVG charts ---------- */
function areaChart(points) {
  // points: [{label, value}] oldest first
  var W = 320, H = 130, P = { l:8, r:8, t:14, b:24 };
  if (!points.length) return '';
  var max = Math.max.apply(null, points.map(function (p) { return p.value; })) || 1;
  var n = points.length, step = n > 1 ? (W - P.l - P.r) / (n - 1) : 0;
  var xy = points.map(function (p, i) {
    return [P.l + (n > 1 ? i * step : (W - P.l - P.r) / 2), P.t + (H - P.t - P.b) * (1 - p.value / max)];
  });
  var line = xy.map(function (q, i) { return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(' ');
  var area = line + ' L' + xy[n - 1][0].toFixed(1) + ' ' + (H - P.b) + ' L' + xy[0][0].toFixed(1) + ' ' + (H - P.b) + ' Z';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c969" stop-opacity=".45"/><stop offset="1" stop-color="#f3c969" stop-opacity="0"/></linearGradient></defs>' +
    [0.25, 0.5, 0.75].map(function (f) { var y = P.t + (H - P.t - P.b) * f; return '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,.06)"/>'; }).join('') +
    '<path d="' + area + '" fill="url(#ag)"/>' +
    '<path d="' + line + '" fill="none" stroke="#f3c969" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    xy.map(function (q, i) {
      return '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + (i === n - 1 ? 5 : 3.5) + '" fill="' + (i === n - 1 ? '#f3c969' : '#121822') + '" stroke="#f3c969" stroke-width="2"/>' +
        '<text x="' + q[0] + '" y="' + (H - 6) + '" fill="#8b97a8" font-size="11" text-anchor="middle">' + esc(points[i].label) + '</text>';
    }).join('') +
    '</svg>';
}
var DONUT = ['#f3c969', '#3ee6a8', '#7aa7ff', '#ff8fa3', '#c792ea', '#ffb86b', '#5ad1e6', '#a3e635'];
function donut(parts, centerTop, centerBottom) {
  var total = parts.reduce(function (s, p) { return s + p.value; }, 0) || 1;
  var R = 50, C = 2 * Math.PI * R, off = 0;
  var arcs = parts.map(function (p, i) {

    var s = '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="' + DONUT[i % DONUT.length] + '" stroke-width="16" stroke-dasharray="' + Math.max(len - gap, 0.1) + ' ' + C + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 66 66)" stroke-linecap="butt"/>';
    off += len; return s;
  }).join('');
  return '<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="' + R + '" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="16"/>' + arcs +

      : '<div class="card loancard fade"><div class="ico" style="background:var(--em-l);color:var(--mint)">' + icon('ok') + '</div>' +
        '<div><b style="font-size:18px">' + t('noLoan') + '</b><div class="label">' + t('net') + ': ' + rs(me.net) + '</div></div></div>';
    var asc = r.history.slice().sort(function (a, b) { return a.month < b.month ? -1 : 1; });
    var cum = 0, pts = asc.map(function (h) { cum += h.deposit; return { label: monthName(h.month, true), value: cum }; });
    var growth = pts.length ? '<div class="card fade"><h2>' + icon('chart').replace('<svg ', '<svg style="width:18px;height:18px;color:var(--gold)" ') + t('growth') + '</h2>' + areaChart(pts.slice(-8)) +
      '<div class="stats" style="margin-top:12px"><div class="stat"><span>' + t('deposited') + '</span><b>' + rs(me.deposited) + '</b></div>' +
      '<div class="stat"><span>' + t('interestShare') + '</span><b class="pos">+' + rs(me.interestShare) + '</b></div></div></div>' : '';
    var hist = r.history.length ? '<ul class="list">' + r.history.map(function (h) {
      var p = h.month.split('-');
      var bits = [];
      if (h.interest) bits.push(t('interest') + ' ' + rs(h.interest));
      if (h.penalty) bits.push(t('penalty') + ' ' + rs(h.penalty));
      if (h.repaid) bits.push(t('repaid') + ' ' + rs(h.repaid));
      if (h.loanTaken) bits.push(t('loanTaken') + ' ' + rs(h.loanTaken));
      var total = h.deposit + h.interest + h.penalty + h.repaid;
      return '<li class="li"><div class="mbadge">' + monthName(h.month, true) + '<small>' + p[0] + '</small></div>' +
        '<div class="mid"><b>' + t('deposit') + ' ' + rs(h.deposit) + '</b><small>' + (bits.length ? esc(bits.join(' · ')) : '&nbsp;') + '</small></div>' +
        '<div class="end"><b>' + rs(total) + '</b>' + (h.paidDate ? '<span class="badge green">✓ ' + dayName(h.paidDate) + '</span>' : '') + '</div></li>';
    }).join('') + '</ul>' : '<p class="label">' + t('none') + '</p>';
    var num = ('0000' + short(me.id)).slice(-4);
    $('pane').innerHTML =
      '<div class="hero fade"><div class="top"><span class="brand">Friends Circle</span><div class="chip"></div></div>' +
      '<div class="cap">' + t('mySavings') + '</div><div class="amt" id="bigamt">₹0</div>' +
      '<div class="cardno">••••  ••••  ••••  ' + num + '</div>' +
      '<div class="holder"><div>' + t('memberLbl') + '<b>' + esc(me.name) + '</b></div><div style="text-align:right">' + t('netLbl') + '<b>' + rs(me.net) + '</b></div></div></div>' +
      loanCard + growth +
      '<div class="card fade"><h2>' + t('history') + '</h2>' + hist + '</div>' +
      '<div class="foot">' + t('updatedAt') + ': ' + monthName(g.lastMonth) + '</div>';
    countUp($('bigamt'), me.savings);
  });
}

/* Page: all members */
function renderAll() {
  loading();
  call('apiMyData', state.token).then(function (r) {
    if (!r.ok) return paneError(r);
    var g = r.group, myId = r.me ? r.me.id : '';
    var tot = { s:0, l:0 }, borrowers = r.members.filter(function (m) { return m.loan > 0; }).sort(function (a, b) { return b.loan - a.loan; });
    r.members.forEach(function (m) { tot.s += m.savings; tot.l += m.loan; });
    var parts = borrowers.map(function (m) { return { name: m.name, value: m.loan }; });
    var donutCard = parts.length ? '<div class="card fade"><h2>' + t('whoBorrowed') + '</h2><div class="donutwrap">' +
      donut(parts, rs(g.loansOutstanding), borrowers.length + ' ' + t('hasLoan')) +
      '<ul class="legend">' + parts.map(function (p, i) { return '<li><i style="background:' + DONUT[i % DONUT.length] + '"></i><span>' + esc(p.name) + '</span><b>' + rs(p.value) + '</b></li>'; }).join('') + '</ul></div></div>' : '';
    $('pane').innerHTML =
      '<div class="hero dark fade"><div class="top"><span class="brand" style="color:var(--gold);opacity:1">' + t('group') + '</span><span class="badge green">' + g.activeMembers + ' ' + t('members') + '</span></div>' +
      '<div class="cap">' + t('totalSavings') + '</div><div class="amt" id="bigamt">₹0</div>' +
      '<div class="row2"><div class="mini"><span>' + t('totalDeposits') + '</span><b>' + rs(g.totalDeposits) + '</b></div>' +
      '<div class="mini"><span>' + t('interestEarned') + '</span><b class="pos">+' + rs(g.interestEarned) + '</b></div></div></div>' +
      donutCard +
      '<div class="stats fade" style="margin-bottom:14px"><div class="stat"><span>' + t('loansOut') + '</span><b>' + rs(g.loansOutstanding) + '</b></div>' +
      '<div class="stat"><span>' + t('cashLeft') + '</span><b>' + rs(g.cashNotHandedOver) + '</b></div></div>' +
      '<div class="card fade"><h2>' + t('everyone') + '</h2><ul class="list">' + r.members.map(function (m) {
        return '<li class="li' + (m.id === myId ? ' me' : '') + '">' + avatar(m.name, m.id) +
          '<div class="mid"><b>' + esc(m.name) + (m.id === myId ? ' <span class="badge gold">' + t('youThis') + '</span>' : '') + '</b>' +
          '<small>#' + esc(short(m.id)) + ' · ' + t('savings') + ' ' + rs(m.savings) + (m.status !== 'active' ? ' · ' + esc(m.status) : '') + '</small></div>' +
          '<div class="end">' + (m.loan > 0 ? '<b class="neg">' + rs(m.loan) + '</b><small class="label">' + t('interest') + ' ' + rs(m.interestDue) + '</small>' : '<span class="badge grey">' + t('noLoan') + '</span>') + '</div></li>';
      }).join('') + '</ul>' +
      '<div class="totalrow"><span>' + t('total') + '</span><span>' + rs(tot.s) + ' · <span class="neg">' + rs(tot.l) + '</span></span></div></div>' +
      '<div class="foot">' + t('updatedAt') + ': ' + monthName(g.lastMonth) + '</div>';
    countUp($('bigamt'), g.totalSavings);
  });
}

/* Page: one month, who paid and when */
function renderMonth(month) {
  loading();
  call('apiMonthView', state.token, month || thisMonth()).then(function (r) {
    if (!r.ok) return paneError(r);
    if (!month && !r.rows.some(function (x) { return x.hasRow; }) && r.months.length) { state.viewMonth = r.months[0]; return renderMonth(r.months[0]); }
    state.viewMonth = r.month;
    var opts = r.months.slice(); if (opts.indexOf(r.month) < 0) opts.push(r.month);
    if (opts.indexOf(thisMonth()) < 0) opts.push(thisMonth());
    opts.sort().reverse();
    var paidN = 0, coll = 0, given = 0;
    r.rows.forEach(function (x) { if (x.deposit > 0) paidN++; coll += x.deposit + x.interest + x.repaid + x.penalty; given += x.loanTaken; });
    var pct = r.rows.length ? Math.round(paidN * 100 / r.rows.length) : 0;
    var rows = r.rows.slice().sort(function (a, b) { return (a.deposit > 0) - (b.deposit > 0) || (a.id < b.id ? -1 : 1); });
    $('pane').innerHTML =
      '<div class="card fade"><select class="f" id="vm" style="font-weight:700">' + opts.map(function (m) { return '<option value="' + m + '"' + (m === r.month ? ' selected' : '') + '>' + monthName(m) + '</option>'; }).join('') + '</select>' +
      '<div class="ringwrap">' + ring(pct) + '<div style="flex:1"><b style="font-size:26px">' + paidN + ' / ' + r.rows.length + '</b><div class="label">' + t('membersPaid') + '</div>' +
      '<div class="stats" style="margin-top:10px;grid-template-columns:1fr"><div class="stat" style="padding:8px 12px"><span>' + t('collected') + '</span><b class="pos">' + rs(coll) + '</b></div></div></div></div>' +
      '<div class="stats" style="margin-top:12px"><div class="stat"><span>' + t('givenOut') + '</span><b>' + rs(given) + '</b></div><div class="stat"><span>' + t('left') + '</span><b>' + rs(coll - given - r.cash) + '</b></div>' +
      '</div></div>' +
      '<div class="card fade"><ul class="list">' + rows.map(function (x) {
        var total = x.deposit + x.interest + x.repaid + x.penalty;
        var bits = [];
        if (x.interest) bits.push(t('interest') + ' ' + rs(x.interest));
        if (x.penalty) bits.push(t('penalty') + ' ' + rs(x.penalty));
        if (x.repaid) bits.push(t('repaid') + ' ' + rs(x.repaid));
        if (x.loanTaken) bits.push(t('loanTaken') + ' ' + rs(x.loanTaken));
        var paid = x.deposit > 0;
        return '<li class="li">' + avatar(x.name, x.id) +
          '<div class="mid"><b>' + esc(x.name) + '</b><small>' + (bits.length ? esc(bits.join(' · ')) : '#' + esc(short(x.id))) + '</small></div>' +
          '<div class="end">' + (paid ? '<b>' + rs(total) + '</b><span class="badge green">✓ ' + (x.paidDate ? dayName(x.paidDate) : t('paid')) + '</span>'
                                       : '<span class="badge red">' + t('notPaid') + '</span>') + '</div></li>';
      }).join('') + '</ul></div>';
    $('vm').onchange = function () { renderMonth($('vm').value); };
    setTimeout(function () { var a = $('ringarc'); if (a) a.style.strokeDashoffset = a.getAttribute('data-to'); }, 40);
  });
}

/* Treasurer: WhatsApp reminders */
function waText(x, month, url, group) {
  var total = x.depositDue + x.interestDue;
  var L = {
    mr: 'नमस्कार ' + x.name + ',\n' + group + '\n' + monthName(month) + ' महिन्याची वर्गणी ₹' + x.depositDue + (x.interestDue ? ' + व्याज ₹' + x.interestDue : '') + ' = एकूण ₹' + total + ' कृपया भरा.\nतुमची बचत: ' + rs(x.savings) + (x.loan ? '\nतुमचे कर्ज: ' + rs(x.loan) : '') + (url ? '\nॲप: ' + url : ''),
    hi: 'नमस्ते ' + x.name + ',\n' + group + '\n' + monthName(month) + ' की जमा ₹' + x.depositDue + (x.interestDue ? ' + ब्याज ₹' + x.interestDue : '') + ' = कुल ₹' + total + ' कृपया जमा करें।\nआपकी बचत: ' + rs(x.savings) + (x.loan ? '\nआपका कर्ज: ' + rs(x.loan) : '') + (url ? '\nऐप: ' + url : ''),
    en: 'Namaste ' + x.name + ',\n' + group + '\n' + monthName(month) + ' deposit ₹' + x.depositDue + (x.interestDue ? ' + interest ₹' + x.interestDue : '') + ' = total ₹' + total + '. Please pay.\nYour savings: ' + rs(x.savings) + (x.loan ? '\nYour loan: ' + rs(x.loan) : '') + (url ? '\nApp: ' + url : '')
  };
  return L[state.lang] || L.mr;
}
function waLink(phone, text) {
  var digits = String(phone || '').replace(/\D/g, '');
  if (digits.length === 10) digits = '91' + digits;
  return 'https://wa.me/' + (digits.length >= 11 ? digits : '') + '?text=' + encodeURIComponent(text);
}
function renderRemind(month) {
  loading();
  call('apiReminders', state.token, month).then(function (r) {
    if (!r.ok) return paneError(r);
    var due = r.rows.filter(function (x) { return !x.paid; }).length;
    var rows = r.rows.slice().sort(function (a, b) { return (a.paid - b.paid) || (a.id < b.id ? -1 : 1); });
    $('pane').innerHTML =
      '<div class="hero dark fade"><div class="cap" style="margin-top:0;color:var(--gold);opacity:1">' + monthName(r.month) + '</div>' +
      '<div class="amt">' + due + ' <span style="font-size:18px;font-weight:600">' + t('stillDue') + '</span></div>' +
      '<div style="font-size:14px;opacity:.9;position:relative;z-index:1">' + t('remindHelp') + '</div></div>' +
      '<div class="card fade"><ul class="list">' + rows.map(function (x) {
        var i = r.rows.indexOf(x);
        return '<li class="li">' + avatar(x.name, x.id) +
          '<div class="mid"><b>' + esc(x.name) + '</b><small>' + rs(x.depositDue + x.interestDue) + (x.paid ? ' · <span class="pos">✓ ' + t('paid') + '</span>' : '') + (x.phone ? '' : ' · ' + t('noPhone')) + '</small></div>' +
          '<div class="end"><a class="wa" target="_blank" rel="noopener" data-wa="' + i + '" href="' + esc(waLink(x.phone, waText(x, r.month, appLink(r.url), r.groupName))) + '">' + icon('wa') + 'WhatsApp</a></div></li>';
      }).join('') + '</ul></div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-wa]'), function (a) {
      a.addEventListener('click', function () { a.classList.add('sent'); a.innerHTML = '✓ WhatsApp'; });
    });
  });
}

function pinCard() {
  return '<div class="card fade"><h2>' + icon('lock').replace('<svg ', '<svg style="width:20px;height:20px;color:var(--em)" ') + t('changePin') + '</h2>' +
    '<label>' + t('oldPin') + '</label><input id="op" type="password" inputmode="numeric" maxlength="12">' +
    '<label>' + t('newPin') + '</label><input id="np" type="password" inputmode="numeric" maxlength="12">' +
    '<button class="btn" id="pbtn">' + t('save') + '</button><div class="err" id="perr"></div></div>' +
    '<div class="secure">' + icon('lock') + t('secure') + '</div>';
}
function wirePin() {
  $('pbtn').onclick = function () {
    $('pbtn').disabled = true;
    call('apiChangePin', state.token, $('op').value, $('np').value).then(function (r) {
      $('pbtn').disabled = false;
      $('perr').className = r.ok ? 'ok' : 'err';
      $('perr').textContent = r.ok ? t('pinChanged') : t(r.error);
      if (r.ok) { $('op').value = ''; $('np').value = ''; }
    });
  };
}

/* Treasurer: monthly entry */
var FIELDS = [['deposit', 'deposit'], ['interest', 'interest'], ['repaid', 'repaid'], ['penalty', 'penalty'], ['loanTaken', 'loanGiven']];

function renderEntry(month) {
  state.month = month;
  $('pane').innerHTML =
    '<div class="card fade" style="display:flex;gap:8px;align-items:center"><input id="mpick" type="month" value="' + esc(month) + '" style="flex:1;font-weight:700">' +
    '<button class="btn ghost" id="mload" style="width:auto">' + t('load') + '</button></div><div id="mbody"><div class="loading"><div class="spin"></div></div></div>';
  $('mload').onclick = function () {
    if (state.dirty && !confirm(t('unsaved'))) return;
    state.dirty = false; renderEntry($('mpick').value || thisMonth());
  };
  call('apiGetMonth', state.token, month).then(function (r) {
    if (!r.ok) { $('mbody').innerHTML = '<div class="card err">' + esc(t(r.error)) + '</div>'; return; }
    state.monthData = r;
    var html = '<div class="card fade" id="mtotals"></div>' +
      '<button class="btn gold" id="fill" style="margin:0 0 14px">' + t('fillExpected') + '</button>';
    html += r.rows.map(function (row, i) {
      var hint = row.loanBefore > 0 ? t('loanBefore') + ' ' + rs(row.loanBefore) + ' · ' + t('suggested') + ' ' + rs(row.suggestedInterest) : '';
      return '<div class="mrow fade' + (row.saved ? ' saved' : '') + '"><div class="head">' + avatar(row.name, row.id) + '<b>' + esc(row.name) + '</b>' +
        (row.saved ? '<span class="badge green">✓ ' + t('saved') + '</span>' : '<span class="badge grey">#' + esc(short(row.id)) + '</span>') + '</div>' +
        (hint ? '<div class="hint">' + hint + '</div>' : '') +
        '<div class="fields">' + FIELDS.map(function (f) {
          var v = row[f[0]] || '';
          return '<div><label>' + t(f[1]) + '</label><input type="number" inputmode="decimal" min="0" step="1" data-i="' + i + '" data-k="' + f[0] + '" value="' + esc(v) + '"></div>';
        }).join('') +
        '<div><label>' + t('datePaid') + '</label><input type="date" data-i="' + i + '" data-k="paidDate" value="' + esc(row.paidDate) + '"></div>' +
        '<div style="grid-column:1/-1"><label>' + t('note') + '</label><input type="text" maxlength="300" data-i="' + i + '" data-k="note" value="' + esc(row.note) + '"></div>' +
        '</div></div>';
    }).join('');
    html += '<div class="sticky"><button class="btn" id="msave">' + t('saveMonth') + '</button></div><div class="err" id="merr"></div>';
    html += '<div class="card" style="margin-top:16px"><h2>' + t('cashTitle') + '</h2>' +
      (r.cash.length ? '<ul class="list">' + r.cash.map(function (c) { return '<li class="li"><div class="mid"><b>' + esc(c.to) + '</b><small>' + esc(c.note) + '</small></div><div class="end"><b>' + rs(c.amount) + '</b></div></li>'; }).join('') + '</ul>' : '') +
      '<label>' + t('handedTo') + '</label><input id="cto" maxlength="100">' +
      '<label>' + t('amount') + '</label><input id="camt" type="number" inputmode="decimal" min="1">' +
      '<label>' + t('note') + '</label><input id="cnote" maxlength="300">' +
      '<button class="btn ghost" id="cadd" style="margin-top:14px">' + t('addCash') + '</button><div class="err" id="cerr"></div></div>';
    $('mbody').innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll('#mbody .mrow input'), function (inp) {
      inp.oninput = function () {
        state.dirty = true;
        var k = inp.getAttribute('data-k');
        if (k !== 'paidDate' && k !== 'note' && inp.value) {
          var dt = document.querySelector('input[data-i="' + inp.getAttribute('data-i') + '"][data-k="paidDate"]');
          if (!dt.value) dt.value = today();
        }
        updateTotals();
      };
    });
    $('fill').onclick = function () {
      r.rows.forEach(function (row, i) {
        var dep = document.querySelector('input[data-i="' + i + '"][data-k="deposit"]');
        var int = document.querySelector('input[data-i="' + i + '"][data-k="interest"]');
        if (!dep.value) { dep.value = row.suggestedDeposit; state.dirty = true; }
        if (!int.value && row.suggestedInterest) { int.value = row.suggestedInterest; state.dirty = true; }
        var dt = document.querySelector('input[data-i="' + i + '"][data-k="paidDate"]');
        if (!dt.value) dt.value = today();
      });
      updateTotals();
    };
    $('msave').onclick = saveMonth;
    if (state.flash) { $('merr').className = 'ok'; $('merr').textContent = state.flash; state.flash = null; }
    $('cadd').onclick = function () {
      $('cadd').disabled = true;
      call('apiAddCash', state.token, month, $('cto').value.trim(), $('camt').value, $('cnote').value).then(function (x) {
        $('cadd').disabled = false;
        if (!x.ok) { $('cerr').textContent = t(x.error); return; }
        renderEntry(month);
      });
    };
    updateTotals();
  });
}

function readRows() {
  return state.monthData.rows.map(function (row, i) {
    var out = { id: row.id };
    FIELDS.concat([['note'], ['paidDate']]).forEach(function (f) {
      var el = document.querySelector('input[data-i="' + i + '"][data-k="' + f[0] + '"]');
      out[f[0]] = (f[0] === 'note' || f[0] === 'paidDate') ? el.value.trim() : (Number(el.value) || 0);
    });
    out._changed = row.saved || FIELDS.some(function (f) { return out[f[0]]; }) || out.note;
    return out;
  });
}

function updateTotals() {
  var rows = readRows(), coll = 0, given = 0;
  rows.forEach(function (r) { coll += r.deposit + r.interest + r.repaid + r.penalty; given += r.loanTaken; });
  var cash = state.monthData.cash.reduce(function (s, c) { return s + c.amount; }, 0);
  $('mtotals').innerHTML = '<div class="stats">' +
    '<div class="stat"><span>' + t('collected') + '</span><b class="pos">' + rs(coll) + '</b></div>' +
    '<div class="stat"><span>' + t('givenOut') + '</span><b>' + rs(given) + '</b></div>' +
    '<div class="stat"><span>' + t('cashTitle') + '</span><b>' + rs(cash) + '</b></div>' +
    '<div class="stat"><span>' + t('left') + '</span><b class="' + (coll - given - cash < 0 ? 'neg' : '') + '">' + rs(coll - given - cash) + '</b></div></div>';
}

function saveMonth() {
  var rows = readRows().filter(function (r) { return r._changed; }).map(function (r) { delete r._changed; return r; });
  $('msave').disabled = true; $('merr').className = 'err'; $('merr').textContent = '';
  call('apiSaveMonth', state.token, state.month, rows).then(function (r) {
    $('msave').disabled = false;
    if (!r.ok) { $('merr').textContent = r.error === 'save_failed' ? t('save_failed') + (r.detail || '') : t(r.error); return; }
    state.dirty = false;
    state.flash = t('savedMsg').replace('{u}', r.updated).replace('{a}', r.added);
    renderEntry(state.month);
  });
}

/* ---------- Boot ---------- */
(function () {
  state.lang = load('sg_lang') || 'mr';
  $('lang').value = state.lang;
  $('lang').onchange = function () {
    state.lang = $('lang').value; store('sg_lang', state.lang);
    if (state.token) start(); else showLogin();
  };
  $('logoutBtn').onclick = function () { logout(false); };
  window.addEventListener('beforeunload', function (e) { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });
  state.token = load('sg_token'); state.role = load('sg_role'); state.tab = load('sg_tab');
  if (state.token && state.role) start(); else showLogin();
})();
</script>
