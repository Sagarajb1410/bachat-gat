<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friends Circle Bachat Gat</title>
<meta name="description" content="आपली बचत, आपला विश्वास">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin:0; height:100%; background:#07090d; color:#eef2f6; font-family:system-ui, sans-serif; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#07090d; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#07090d; transition:opacity .4s; z-index:2; }
  #splash img { width:88px; height:88px; border-radius:24px; }
  #splash b { font-size:20px; }
  #splash span { color:#f3c969; font-size:14px; }
  .bar { width:120px; height:4px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar i { display:block; width:40%; height:100%; background:#f3c969; animation:s 1.1s ease-in-out infinite; }
  @keyframes s { 0% { transform:translateX(-100%); } 100% { transform:translateX(300%); } }
  #off { display:none; position:fixed; inset:0; z-index:3; background:#07090d; align-items:center; justify-content:center; text-align:center; padding:24px; }
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><b>Friends Circle Bachat Gat</b><span>आपली बचत, आपला विश्वास</span><div class="bar"><i></i></div></div>
<div id="off"><div><b>इंटरनेट नाही</b><p>इंटरनेट सुरू करा आणि पुन्हा उघडा.<br>No internet. Please connect and reopen.</p></div></div>
<iframe id="app" title="Friends Circle Bachat Gat" allow="clipboard-write"></iframe>
<script>
  // The group's Apps Script web app (the /exec link from Deploy). Only this line changes if the link changes.
  var APP_URL = 'PASTE_WEB_APP_URL_HERE';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  f.onload = function () { sp.style.opacity = 0; setTimeout(function () { sp.style.display = 'none'; }, 400); };
  f.src = APP_URL;
  function net() { document.getElementById('off').style.display = navigator.onLine ? 'none' : 'flex'; }
  addEventListener('online', function () { net(); f.src = APP_URL; }); addEventListener('offline', net); net();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
